<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Realtime 4x4 Grid</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      height: 100vh;
      width: 100vw;
      gap: 5px;
      padding: 5px;
      box-sizing: border-box;
      background: #222;
    }

    .cell {
      background: #444;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell:hover {
      background: #666;
    }

    .highlight {
      background: #00ff88 !important;
    }
  </style>
</head>
<body>

<div id="grid"></div>

<script type="module">
  // Import Firebase (v10 modular)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    set, 
    onValue 
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";


  // 🔴 REPLACE WITH YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyB_udqJzoNoLzVS_Q1bLJFHIxhfG4R0OJ8",
    authDomain: "selector-38b9e.firebaseapp.com",
    projectId: "selector-38b9e",
    storageBucket: "selector-38b9e.firebasestorage.app",
    messagingSenderId: "81446126450",
    appId: "1:81446126450:web:9eff6a2e76f763296cd3eb",
    databaseURL: "https://selector-38b9e-default-rtdb.firebaseio.com"

  };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const grid = document.getElementById("grid");

  // Create 16 cells
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;

    cell.addEventListener("click", () => {
      set(ref(db, "highlightedCell"), i);
    });

    grid.appendChild(cell);
  }

  // Listen for changes in real-time
  onValue(ref(db, "highlightedCell"), (snapshot) => {
    const selected = snapshot.val();

    document.querySelectorAll(".cell").forEach(cell => {
      cell.classList.remove("highlight");
    });

    if (selected !== null) {
      const active = document.querySelector(`.cell[data-index='${selected}']`);
      if (active) active.classList.add("highlight");
    }
  });
</script>

</body>
</html>
