<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Realtime 4x4 Grid</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      height: 100vh;
      width: 100vw;
      gap: 5px;
      padding: 5px;
      box-sizing: border-box;
      background: #222;
    }

    .cell {
      position: relative;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      font-family: sans-serif;
      transition: 0.3s ease;
      box-sizing: border-box;
    }

    /* Much darker overlay for inactive cells */
    .cell::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      transition: 0.3s ease;
      z-index: 1;
    }

    /* Active cell = remove dark overlay + white outline */
    .cell.active::after {
      background: rgba(0, 0, 0, 0);
    }

    .cell.active {
      outline: 5px solid white;
      outline-offset: -5px;
    }

    /* Top number */
    .top-number {
      position: absolute;
      top: 10%;
      left: 50%;
      font-size: 20px;
      font-weight: bold;
      color: white;
      z-index: 2;
      text-shadow: -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000, 1px 1px 1px #000;
    }

    /* Title */
    .song-title {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-size: 25px;
      font-weight: bold;
      color: #bbbbbb; /* grey by default */
      z-index: 2;
      transition: 0.3s ease;
      text-shadow: -1px -1px 1px #000, 1px -1px 1px #000, -1px 1px 1px #000, 1px 1px 1px #000;
    }

    /* Active title becomes white */
    .cell.active .song-title {
      color: white;
    }


  </style>
</head>
<body>

<div id="grid"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    set, 
    onValue 
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const SHOW_TITLES = true;

  const songs = [
    "Les Ancêtres", "Adam's Step", "Yaman Yar", "Pinson's Place",
    "Chorinho for Tati", "New Paths", "Um Choro Felis", "Check Mate",
    "Hurricane Siesta", "Hopeful Hero", "Zikhrono Livrakha", "Aaron's Mirror",
    "House on a Hill", "Perdrille", "--", "--"
  ];

  const colors = [
    "#FF6B6B", "#6BCB77", "#4D96FF", "#FFD93D",
    "#FF9F1C", "#9D4EDD", "#00C2A8", "#F15BB5",
    "#00BBF9", "#FEE440", "#EF476F", "#06D6A0",
    "#118AB2", "#8338EC", "#FF006E", "#3A86FF"
  ];

  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "selector-38b9e.firebaseapp.com",
    databaseURL: "https://selector-38b9e-default-rtdb.firebaseio.com",
    projectId: "selector-38b9e",
    storageBucket: "selector-38b9e.firebasestorage.app",
    messagingSenderId: "81446126450",
    appId: "1:81446126450:web:9eff6a2e76f763296cd3eb"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const grid = document.getElementById("grid");

  for (let i = 0; i < 16; i++) {
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;
    cell.style.background = colors[i];

    const topNumber = document.createElement("div");
    topNumber.classList.add("top-number");
    topNumber.textContent = i + 1;

    const title = document.createElement("div");
    title.classList.add("song-title");
    title.textContent = songs[i];

    if (!SHOW_TITLES) {
      title.style.display = "none";
    }

    cell.appendChild(topNumber);
    cell.appendChild(title);

    cell.addEventListener("click", () => {
      set(ref(db, "highlightedCell"), i);
    });

    grid.appendChild(cell);
  }

  onValue(ref(db, "highlightedCell"), (snapshot) => {
    const selected = snapshot.val();

    document.querySelectorAll(".cell").forEach(cell => {
      cell.classList.remove("active");
    });

    if (selected !== null) {
      const active = document.querySelector(`.cell[data-index='${selected}']`);
      if (active) {
        active.classList.add("active");
      }
    }
  });
</script>



</body>
</html>
